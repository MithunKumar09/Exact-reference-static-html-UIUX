<!DOCTYPE html>
<!-- ===========================================================================
     STANDARD · PRODUCT EXPERIENCE PLATFORM  —  static demo build v1.0
     ---------------------------------------------------------------------------
     HOW TO WORK ON THIS FILE
       • This file is the SHELL: the <head> (meta, fonts, stylesheets) plus the
         loader at the bottom. Everything you see on screen lives in parts/*.html
         and is fetched and assembled here at load time — edit a part, reload the
         page, done. There is no build step and no generated index.html.
       • The parts are HTML FRAGMENTS, not pages: parts/03 opens the
         <div class="stage"> that parts/09 closes. They are joined in the PARTS
         order below and parsed as one blob, so never open a part on its own and
         never reorder the list.
       • Copy lives in  parts/*.html , in plain HTML. Edit text directly there.
       • Colours live in  assets/css/tokens.css  (change 6 seeds to rebrand).
       • Demo asset URLs live in  assets/js/config.js.
       • Behaviour lives in  assets/js/core.min.js  (source: assets/js/_source/).
       • Every screen is one <section class="screen" id="s-NAME">.
         Navigation is  data-goto="NAME"  on any element. That is the whole API.
       • fetch() needs HTTP, so serve the folder:  npx serve .  (or
         python -m http.server 8080). For one double-clickable file instead, run
         python tools/build-html.py  — it writes standalone.html with the parts
         already inlined.
     =========================================================================== -->
<html lang="en" data-brand="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C2742">
<meta name="description" content="STANDARD DI 470 — interactive product experience: 360° view, exploded diagram, schematics, specifications and more.">
<title>STANDARD · DI 470 Product Experience</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/ui.css">
<link rel="stylesheet" href="assets/css/rail.css">
<link rel="stylesheet" href="assets/css/screens.css">
<link rel="stylesheet" href="assets/css/diagrams.css">
<link rel="stylesheet" href="assets/css/detail.css">
<link rel="stylesheet" href="assets/css/content.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230068FE'/%3E%3Cpath d='M21 10c-3-2-9-1-9 3s9 3 9 7-6 4-9 2' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="assets/js/config.js"></script>
</head>
<body>

<noscript>
  <div style="font:500 15px/1.6 Inter,system-ui,sans-serif;max-width:46rem;margin:12vh auto;padding:0 1.5rem;color:#0C2742">
    <h1 style="font:800 22px/1.3 Inter,system-ui,sans-serif;margin:0 0 .6em">JavaScript is required</h1>
    <p>This product experience assembles its screens and runs its 360° viewer in the browser.
       Enable JavaScript, or open <strong>standalone.html</strong>.</p>
  </div>
</noscript>

<!-- parts:begin — tools/build-html.py replaces this block with the inlined parts -->
<script>
(function () {
  'use strict';

  /*  Every piece of the page, in document order. Adding a screen means adding
      its file here — that is the only registry. */
  var PARTS = [
    'parts/02-icon-sprite.html',            /* <symbol id="i-*"> sprite                    */
    'parts/03-app-chrome.html',             /* stage, topbar, tabnav, rail                 */
    'parts/04-listing-overview.html',       /* 01 Listing · 02 Overview                     */
    'parts/05-view-360.html',               /* 03 360° View                                 */
    'parts/06-diagrams.html',               /* 04 Exploded · 05 Schematic · 06 Drawing       */
    'parts/07-detail-screens.html',         /* 07 Exterior … 11 Features                    */
    'parts/08-content-screens.html',        /* 12 Specs · 13 Videos · 14 Gallery · 15 Brochure */
    'parts/09-compare-enquire-footer.html'  /* 16 Compare · 17 Variants · 18 Enquire, footer */
  ];
  var RUNTIME = 'assets/js/core.min.js';

  function fail(title, body, detail) {
    document.body.innerHTML =
      '<div style="font:500 15px/1.6 Inter,system-ui,sans-serif;max-width:46rem;' +
      'margin:12vh auto;padding:0 1.5rem;color:#0C2742">' +
      '<h1 style="font:800 22px/1.3 Inter,system-ui,sans-serif;margin:0 0 .6em">' + title + '</h1>' +
      '<p style="margin:0 0 1em">' + body + '</p>' +
      '<pre style="background:#F1F4F8;border-radius:8px;padding:.9em 1.1em;overflow:auto;' +
      'font:500 13px/1.7 ui-monospace,Menlo,Consolas,monospace">npx serve .\npython -m http.server 8080</pre>' +
      (detail ? '<p style="margin:1em 0 0;color:#7A8794;font-size:13px">' + detail + '</p>' : '') +
      '</div>';
  }

  if (location.protocol === 'file:') {
    fail('Serve this folder over HTTP',
         'index.html loads its screens from <code>parts/</code> with fetch(), which the ' +
         'browser blocks on <code>file://</code>. Start a local server and open the ' +
         'address it prints — or open <strong>standalone.html</strong>, the single-file ' +
         'build with the parts already inlined.');
    return;
  }

  function get(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (res) {
      if (!res.ok) throw new Error(url + ' — HTTP ' + res.status);
      return res.text();
    });
  }

  Promise.all(PARTS.map(get)).then(function (chunks) {
    /*  One parse, not eight. The parts only balance once joined (parts/03 opens
        .stage and #screens, parts/09 closes them), so they go in together. */
    document.body.innerHTML = chunks.join('');

    /*  Boot the runtime only now that the DOM it queries exists. A script added
        this way runs as soon as it arrives, and core.js boots straight away
        because readyState is no longer 'loading'. */
    var s = document.createElement('script');
    s.src = RUNTIME;
    s.onerror = function () { fail('Runtime failed to load', 'Could not fetch ' + RUNTIME + '.'); };
    document.body.appendChild(s);
  }).catch(function (err) {
    fail('Could not load the page parts',
         'One of the files in <code>parts/</code> did not come back. Check that the folder ' +
         'was deployed alongside index.html.',
         err && err.message);
  });
})();
</script>
<!-- parts:end -->

</body>
</html>
